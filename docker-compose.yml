version: "3.9"
services:
  app:
    container_name: officeops-local
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${PORT:-4028}:4028"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4028"]
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: officeops-db
    environment:
      - POSTGRES_DB=${DB_NAME:-officeops}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-officeops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data: