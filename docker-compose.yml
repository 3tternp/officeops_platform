version: "3.9"
services:
  app:
    container_name: officeops-local
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # SMTP / Email settings (optional; used by Netlify functions)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS}
    ports:
      - "${PORT:-4028}:4028"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4028"]
    restart: unless-stopped
    depends_on:
      - db

  netlify:
    image: node:20
    container_name: officeops-netlify
    working_dir: /app
    environment:
      - NODE_ENV=development
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS}
    volumes:
      - .:/app
    ports:
      - "${NETLIFY_PORT:-8888}:8888"
    command: ["npx", "netlify", "dev", "--functions", "netlify/functions", "--targetPort", "4028", "--port", "8888"]
    depends_on:
      - app

  db:
    image: postgres:17
    container_name: officeops-db
    environment:
      - POSTGRES_DB=${DB_NAME:-officeops}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-officeops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data: