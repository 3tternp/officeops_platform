version: '3.8'

# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # Frontend Development
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: officeops-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4028}:4028"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_APP_NAME=OfficeOps Platform (Dev)
      - VITE_APP_VERSION=2.3.0-dev
      - VITE_API_URL=http://localhost:3001/api
      - CHOKIDAR_USEPOLLING=true
    networks:
      - officeops-network
    command: npm run dev
    profiles:
      - dev

  # Development Database with initialization
  database:
    environment:
      POSTGRES_DB: ${DB_NAME:-officeops_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/dev-data:/docker-entrypoint-initdb.d/dev-data

  # Development Redis
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data

  # Backend API Development
  backend:
    environment:
      NODE_ENV: development
      DB_NAME: ${DB_NAME:-officeops_dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis123}
      JWT_SECRET: ${JWT_SECRET:-dev-super-secret-jwt-key}
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:4028}
      DEBUG: "true"
      LOG_LEVEL: debug
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    command: npm run dev

  # Development Tools
  adminer:
    image: adminer:latest
    container_name: officeops-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
      ADMINER_DESIGN: dracula
    depends_on:
      - database
    networks:
      - officeops-network
    profiles:
      - tools
      - dev

  # Mail service for development (MailHog)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: officeops-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025"    # Web UI
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP
    networks:
      - officeops-network
    profiles:
      - tools
      - dev

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  backend_node_modules:
    driver: local

networks:
  officeops-network:
    driver: bridge
